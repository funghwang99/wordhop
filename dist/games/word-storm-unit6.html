a person forced to leave home because of danger or disaster","example":"Climate change may create environmental refugees.","answer":"refugees","cloze":"Climate change may create environmental _______.","type":"CLOZE","sector":"climate"},{"id":"bir-u6-shift","term":"shift","pos":"v.","definition":"to move from one place to another","example":"Crop-growing areas may shift north over time.","answer":"shift","cloze":"Crop-growing areas may _______ north over time.","type":"PARAPHRASE","sector":"climate","paraphrase":"Crop-growing areas may <mark>move<\/mark> further north as temperatures rise.","focus":"move"},{"id":"bir-u6-top","term":"top","pos":"v.","definition":"to be higher or more than a particular amount","example":"The temperature would top 90 degrees.","answer":"top","cloze":"The temperature would _______ 90 degrees.","type":"CLOZE","sector":"climate"},{"id":"bir-u6-tragedy","term":"tragedy","pos":"n.","definition":"a very sad event","example":"The flood was a tragedy for many families.","answer":"tragedy","cloze":"The flood was a _______ for many families.","type":"RADAR","sector":"climate"},{"id":"bir-u6-trap","term":"trap","pos":"v.","definition":"to catch and hold something so it cannot escape","example":"Greenhouse gases trap heat in the atmosphere.","answer":"trap","cloze":"Greenhouse gases _______ heat in the atmosphere.","type":"PARAPHRASE","sector":"climate","paraphrase":"These gases <mark>hold and prevent the escape of<\/mark> heat.","focus":"hold and prevent the escape of"},{"id":"bir-u6-worthwhile","term":"worthwhile","pos":"adj.","definition":"useful and worth the time or effort","example":"The plan is difficult but worthwhile.","answer":"worthwhile","cloze":"The plan is difficult but _______.","type":"CLOZE","sector":"climate"}]</script>

function sfx(kind){if(!s.sound)return;try{const Audio=window.AudioContext||window.webkitAudioContext;s.audio=s.audio||new Audio();if(s.audio.state==='suspended')s.audio.resume();const notes=kind==='good'?[[570,.11],[760,.12],[990,.16]]:kind==='bad'?[[210,.18],[130,.24]]:kind==='click'?[[390,.045]]:[[400,.12],[620,.19]];notes.forEach(([freq,d],i)=>{const t=s.audio.currentTime+i*.07,o=s.audio.createOscillator(),g=s.audio.createGain();o.type=kind==='bad'?'triangle':'sine';o.frequency.setValueAtTime(freq,t);if(kind==='bad')o.frequency.exponentialRampToValueAtTime(Math.max(55,freq*.62),t+d);g.gain.setValueAtTime(.047,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(s.audio.destination);o.start(t);o.stop(t+d+.01);});}catch{}}
function showOverlay(code){el.overlay.hidden=false;el.overlay.innerHTML=code;}

function showMenu(){s.phase='menu';s.mode='training';s.index=0;s.score=0;s.correct=0;s.attempted=0;s.streak=0;s.shields=3;s.particles=[];s.question=null;s.reported=false;updateHud();el.zone.textContent='STANDBY · WEATHER STATION';el.board.innerHTML='<div class="eyebrow">STATION BRIEFING</div><h2>The storm is approaching.</h2><p class="sub">Select the right answer to send power to the shield. Four multiple-choice signal types will rotate during the mission.</p><div class="panel"><span class="instruction">STRESS ZONE · CLIMATE FRONT</span><p class="prompt">46 IELTS vocabulary words</p><p class="hint">Definitions · Context · Scrambled codes · Paraphrase</p></div>';showOverlay(`<div class="modal"><div class="icon-big" aria-hidden="true">🌪️</div><span class="kicker">WORDHOP ARCADE · MISSION 06</span><h2>THE <em>STORM</em> IS COMING</h2><p>Power the weather station by choosing the correct word. Four kinds of multiple-choice puzzles, one storm to stop.</p><div class="guide"><span>📡 Definitions</span><span>📝 Context</span><span>🔐 Word code</span><span>🟨 Paraphrase</span></div><div class="selectors"><label>WORDS PER MISSION<select id="roundSelect"><option value="10">10 signals</option><option value="20">20 signals</option><option value="46">All 46 signals</option></select></label><label>DIFFICULTY<select id="modeSelect"><option value="training">Training · No timer</option><option value="storm">Storm · 40 seconds / signal</option></select></label></div><button class="btn" id="startBtn" type="button">ACTIVATE STATION →</button><p style="font-size:10px;margin:13px 0 0">Tap an answer or use keys 1–4 · Training: no lost shields · Storm: three shields and a timer · Best: ${storedBest.toLocaleString()}</p></div>`);$('#startBtn').addEventListener('click',start);}
function balancedDeck(count){const types=['RADAR','CLOZE','CIPHER','PARAPHRASE'],buckets=Object.fromEntries(types.map(t=>[t,shuffle(Q.filter(q=>q.type===t))])),out=[];while(out.length<count){const cycle=shuffle(types.filter(t=>buckets[t].length));for(const t of cycle){if(out.length>=count)break;out.push(buckets[t].pop());}}return out;}

function makeOptions(q){const target=q.type==='CLOZE'?q.answer:q.term;const samePos=Q.filter(x=>x.id!==q.id&&x.sector===q.sector&&x.pos===q.pos);const sameSector=Q.filter(x=>x.id!==q.id&&x.sector===q.sector);const others=Q.filter(x=>x.id!==q.id);const out=[target],used=new Set([norm(target)]);for(const pool of [samePos,sameSector,others]){for(const x of shuffle(pool)){const answer=q.type==='CLOZE'?x.answer:x.term;if(used.has(norm(answer)))continue;out.push(answer);used.add(norm(answer));if(out.length===4)break;}if(out.length===4)break;}if(out.length!==4)throw Error('Not enough answer options for '+q.term);return shuffle(out);}

function drawRadar(dt){s.sceneT+=dt;s.flash=Math.max(0,s.flash-dt*2.4);s.shake=Math.max(0,s.shake-dt*12);for(const p of s.particles){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.max(.87,1-dt*1.4);p.vy*=Math.max(.85,1-dt*.9);}s.particles=s.particles.filter(p=>p.age<p.life);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);ctx.save();if(s.shake>0)ctx.translate(rand(-s.shake,s.shake),rand(-s.shake,s.shake));const cx=W*.50,cy=H*.55,r=Math.min(W*.36,H*.37),t=s.sceneT,progress=s.total?Math.min(1,s.correct/s.total):0;

const fill=ctx.createRadialGradient(cx,cy,0,cx,cy,r*.48);fill.addColorStop(0,'#8bfedb49');fill.addColorStop(1,'#8bfedb00');ctx.fillStyle=fill;ctx.beginPath();ctx.arc(cx,cy,r*.48,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#7affca';ctx.shadowColor='#5effc5';ctx.shadowBlur=15+progress*28;ctx.lineWidth=3+progress*4;ctx.beginPath();ctx.arc(cx,cy,22+progress*13,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;

if(new URLSearchParams(location.search).has('debug'))window.__wordStormTest={snapshot:()=>({phase:s.phase,type:s.question?.type,index:s.index,total:s.total,term:s.question?.term,answer:s.question?.type==='CLOZE'?s.question?.answer:s.question?.term,score:s.score,correct:s.correct,attempted:s.attempted,options:s.answerOptions,shields:s.shields,missed:s.missed.length}),forceAnswer:correct=>{if(s.phase==='playing')markAnswer(correct);},advance:()=>{if(s.phase==='feedback')continueGame();},start,menu:showMenu};
