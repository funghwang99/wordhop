(()=>{'use strict';

function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(x){return String(x??'').toLowerCase().replace(/[‘’]/g,"'").replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ')}

function homeArt(){return `<div class="home-art"><div class="sun"></div><div class="mountain1"></div><div class="mountain2"></div><div class="mountain3"></div><div class="flagpost"></div><div class="character">${characterSvg()}</div></div>`}
function showHome(){s.phase='home';screen.innerHTML=`<section class="panel home"><div class="home-hero"><div class="home-copy"><p class="kicker">THE COASTAL RESCUE EXPEDITION</p><h1 class="heading">Choose your path.<br><span style="color:#0ba69b">Reach the summit.</span></h1><p class="muted">Build vocabulary, earn climbing energy and solve six mountain routes. Every handhold is your decision — no random bounces, no rushed timer.</p><span class="pill">✦ B1 Preliminary · Trainer Test 2</span><div class="feature-row"><span class="feature">24 real book words</span><span class="feature">4 mission types</span><span class="feature">6 interactive climbs</span></div></div>${homeArt()}</div><div class="setup"><div><div class="field-title">Vocabulary missions</div><div class="choices" id="counts">${[8,16,24].map(n=>`<button class="choice ${s.count===n?'on':''}" data-count="${n}">${n} words</button>`).join('')}</div></div><div><div class="field-title">Expedition difficulty</div><div class="choices" id="difficulties"><button class="choice ${s.difficulty==='explorer'?'on':''}" data-diff="explorer">Explorer</button><button class="choice ${s.difficulty==='summit'?'on':''}" data-diff="summit">Summit</button></div></div><button class="btn primary playbtn" id="start">START EXPEDITION →</button></div></section><div class="how"><div class="tip"><span class="num">01</span><div><strong>Learn the code</strong><p>Complete 4 vocabulary missions. Correct first tries earn extra energy.</p></div></div><div class="tip"><span class="num">02</span><div><strong>Climb the wall</strong><p>Tap glowing handholds. Choose a route that saves energy.</p></div></div><div class="tip"><span class="num">03</span><div><strong>Reach the summit</strong><p>Complete the rescue and revisit tricky words.</p></div></div></div>`;
 $$('[data-count]').forEach(b=>b.onclick=()=>{s.count=+b.dataset.count;showHome()});$$('[data-diff]').forEach(b=>b.onclick=()=>{s.difficulty=b.dataset.diff;showHome()});$('#start').onclick=startGame;msgHeight()}
function startGame(){s.deck=WORDS.slice(0,s.count);s.index=0;s.correct=0;s.score=0;s.climbsDone=0;s.climbFails=0;s.stageCorrect=0;s.missed=new Set();resetQuestion();showQuestion();window.scrollTo({top:0,behavior:'smooth'})}

function distractors(w, useAnswer){const field=useAnswer?'answer':'term';let same=WORDS.filter(x=>x.term!==w.term&&x.sourcePart===w.sourcePart);let others=WORDS.filter(x=>x.term!==w.term&&x.sourcePart!==w.sourcePart);return [...shuffle(same),...shuffle(others)].slice(0,s.difficulty==='summit'?3:2).map(x=>x[field])}
function optionButtons(target,useAnswer=false){let opts=shuffle([{text:useAnswer?target.answer:target.term,correct:true},...distractors(target,useAnswer).map(text=>({text,correct:false}))]);s.choices=opts;return `<div class="answer-grid">${opts.map((o,i)=>`<button class="answer" data-opt="${i}"><span class="letter">${String.fromCharCode(65+i)}</span>${esc(o.text)}</button>`).join('')}</div>`}
function chunks(w){if(w.term.includes(' '))return w.term.split(' ');if(w.term.includes('-'))return w.term.split(/(?<=-)/);const word=w.term;const len=word.length;let cut1=Math.ceil(len/3),cut2=Math.ceil(len*2/3);return [word.slice(0,cut1),word.slice(cut1,cut2),word.slice(cut2)].filter(Boolean)}
function questionBody(w,type){if(type==='meaning')return `<h1>Which word matches this clue?</h1><p class="sentence">${esc(w.definition)}</p>${optionButtons(w)}`;
 if(type==='context')return `<h1>Complete the field report.</h1><p class="sentence">${esc(w.cloze).replace('________','<mark>________</mark>')}</p>${optionButtons(w,true)}`;
 if(type==='typing')return `<h1>Decode the radio message.</h1><p class="sentence">${esc(w.definition)}</p><section class="radio-board" aria-label="Radio Code word building"><h2>📡 Tap the code pieces to build the word</h2><p class="radio-help">Tap the pieces in the correct order. No typing required. Use Undo if you make a mistake.</p><div id="radio-built" class="radio-built" aria-live="polite"></div><div id="radio-tiles" class="radio-tiles" aria-label="Word pieces"></div><div class="radio-tools"><button type="button" class="btn secondary" id="radio-undo">↶ Undo</button><button type="button" class="btn secondary" id="radio-clear">↻ Clear</button></div><button type="button" class="btn primary radio-continue hidden" id="radio-continue">NEXT MISSION →</button><button type="button" class="btn typing-reveal" id="radio-reveal" style="width:100%;margin-top:12px;min-height:48px;background:#fff5eb;color:#95542d;border:1px solid #eebc86">Show answer &amp; continue · no points</button></section><details class="type-optional"><summary>Prefer typing? Open keyboard entry</summary><form class="typing-form" id="answer-form" novalidate><input id="typed" type="text" inputmode="text" enterkeyhint="done" autocapitalize="off" spellcheck="false" autocomplete="off" placeholder="Or type the English word or phrase" aria-label="Type the vocabulary answer" maxlength="100"><button class="btn teal" id="typing-check" type="submit">CHECK ✓</button></form><p class="typing-instruction" id="typing-instruction">Press Enter or tap Check. If your keyboard does not submit, use the pieces above.</p></details>`;
 let ps=chunks(w).map((t,i)=>({id:i,text:t}));s.parts=shuffle(ps);if(s.parts.length>1&&s.parts.every((x,i)=>x.id===i))s.parts.reverse();return `<h1>Repair the equipment label.</h1><p class="sentence">${esc(w.definition)}</p><p class="muted" style="font-size:13px;margin:-6px 0 7px">Tap the pieces in the correct order.</p><div class="slot" id="slots"><span style="color:#8da4b8;background:none;border:0">Tap a piece below ↓</span></div><div class="tiles" id="tiles"></div><div class="actions"><button class="btn secondary tiny" id="undo">← Undo</button><button class="btn secondary tiny" id="clear">Clear</button><button class="btn teal tiny" id="assemble">CHECK LABEL ✓</button></div>`}
function showQuestion(){s.phase='question';const w=s.deck[s.index],t=questionType(),part=LEVELS[chapterAt(s.index)];screen.innerHTML=`<div class="gamehead"><button class="back" id="back">← Main menu</button><div class="scorechips"><div>📚 <b>${s.index+1}/${s.deck.length}</b> words</div><div>⭐ <b>${s.score}</b> points</div><div>🧗 <b>${s.climbsDone}/${s.count/4}</b> climbs</div></div></div><div class="progress"><div style="width:${s.index/s.deck.length*100}%"></div></div><div class="questgrid"><section class="panel question"><span class="q-kind">✦ MISSION ${s.index+1} · ${typeNames[s.index%4].toUpperCase()}</span>${questionBody(w,t)}<div class="support"><div class="feedback" id="feedback" aria-live="polite">${t==='typing'?'Tap the code pieces in the right order. Or open keyboard entry below. You can always show the answer and continue without points.':t==='rebuild'?'Arrange all pieces, then check the label.':'Choose a word. You can retry if your first answer is wrong.'}</div></div><div class="actions"><button class="btn secondary tiny" id="hint">💡 HINT</button><button class="btn danger tiny hidden" id="reveal">Reveal answer</button><button class="btn primary hidden" id="next">NEXT MISSION →</button></div></section><aside class="side">${sceneArt(s.index)}<div class="panel companion"><h3>📍 ${part.name}</h3><p>${part.brief}. Complete four vocabulary missions. First-try answers earn extra energy for the climb.</p><div class="steps">${[0,1,2,3].map(i=>`<span class="stepchip ${i<s.index%4?'done':i===s.index%4?'on':''}">Mission ${i+1}</span>`).join('')}</div></div></aside></div>`;
 $('#back').onclick=()=>{if(confirm('Leave this expedition? Your unfinished progress will not be saved.'))showHome()};
 $('#hint').onclick=()=>{if(s.answered)return;s.hinted=true;s.missed.add(w.term);let clue=t==='context'||t==='meaning'?`The answer starts with “${w.term[0].toUpperCase()}”.`:`First letters: ${w.term.split(/\s+/).map(x=>x[0].toUpperCase()).join(' · ')}.`;feedback(clue,false)};

 $('#next').onclick=nextQuestion;
 if(t==='meaning'||t==='context')$$('[data-opt]').forEach(b=>b.onclick=()=>checkAnswer(s.choices[+b.dataset.opt].correct,b));

      const answer=s.radio.placed.map(i=>s.radio.tiles[i].text).join(w.term.includes(' ')?' ':'');

 }

 msgHeight()}
function drawPieces(){if(s.phase!=='question')return;let w=s.deck[s.index],slot=$('#slots'),tray=$('#tiles');if(!slot||!tray)return;slot.innerHTML=s.placed.length?s.placed.map(i=>`<span>${esc(s.parts[i].text)}</span>`).join(''):'<span style="color:#8da4b8;background:none;border:0">Your label appears here</span>';tray.innerHTML=s.parts.map((p,i)=>`<button class="tile" data-piece="${i}" ${s.placed.includes(i)?'disabled':''}>${esc(p.text)}</button>`).join('');$$('[data-piece]').forEach(b=>b.onclick=()=>{if(s.answered)return;s.placed.push(+b.dataset.piece);drawPieces()})}
function normalisedEquivalent(a,b){return norm(a).replace(/\s+/g,'')===norm(b).replace(/\s+/g,'')}
function renderRadio(){

}
function feedback(t,success){const a=$('#feedback');if(a){a.textContent=t;a.className='feedback '+(success?'good':'bad')}}
function checkAnswer(a,b){if(s.answered||s.phase!=='question')return;const w=s.deck[s.index],t=questionType();if(t==='typing'&&!norm(a)){feedback('Type your answer, then press Enter or tap CHECK.',false);$('#typed')?.focus();return}
 if(t==='rebuild'&&s.placed.length!==s.parts.length){feedback('Place all the pieces before checking the label.',false);return}
 const correct=t==='meaning'||t==='context'?a===true:normalisedEquivalent(a,w.term)||normalisedEquivalent(a,w.answer);
 if(correct){if(t==='typing')$('#typed')?.blur();resolveQuestion(!s.attempts&&!s.hinted,false);if(b)b.classList.add('good');return}
 s.attempts++;s.missed.add(w.term);feedback(`Not quite! Try another answer. ${s.attempts>=2?'You can now reveal the answer and continue.':'You have another attempt.'}`,false);if(b){b.classList.add('bad');b.disabled=true}if(s.attempts>=2){
  $('#reveal')?.classList.remove('hidden');

}
function resolveQuestion(firstTry,wasRevealed){if(s.answered)return;const w=s.deck[s.index];s.answered=true;if(firstTry){s.correct++;s.stageCorrect++;s.score+=s.difficulty==='summit'?45:35}else if(!wasRevealed){s.score+=8;s.missed.add(w.term)}else{s.missed.add(w.term)}feedback(wasRevealed?`Answer: ${w.term}. This word is saved for review. You may continue.`:`✓ ${w.term} — ${firstTry?'Excellent! First-try bonus earned.':'Nice recovery! Keep practising this word.'}`,!wasRevealed);
 $$('[data-opt]').forEach(b=>b.disabled=true);$('#typed')?.setAttribute('disabled','');$('#typing-check')?.setAttribute('disabled','');$('#assemble')?.setAttribute('disabled','');$$('[data-piece]').forEach(b=>b.disabled=true);$('#hint').classList.add('hidden');$('#reveal').classList.add('hidden');$('#radio-reveal')?.setAttribute('disabled','');$('#radio-continue')?.classList.remove('hidden');$('#radio-undo')?.setAttribute('disabled','');$('#radio-clear')?.setAttribute('disabled','');$('#next').classList.remove('hidden');

  $('#typed')?.blur();

   if(s.phase==='question'&&s.answered&&s.deck===deck&&s.index===index)nextQuestion();

function nextQuestion(){s.index++;if(s.index%4===0){startClimb()}else{resetQuestion();showQuestion()}window.scrollTo({top:0,behavior:'smooth'})}
const paths=[[2,2,1,2,3],[2,1,1,2,2],[2,2,3,3,2],[2,3,3,2,2],[2,1,2,1,2],[2,2,2,3,3]];
function layoutFor(stage){let ideal=paths[stage%paths.length],grid=[];for(let row=0;row<5;row++){grid[row]=[];for(let col=0;col<5;col++){let onPath=ideal[4-row]===col,type;if(row===4){type='solid'}else if(onPath){type=(row===2&&stage%2===1)?'boost':'solid'}else{type=((row*7+col*3+stage*5)%4<3)?'weak':'solid'}grid[row][col]=type}}return {ideal,grid}}
function startClimb(){let stage=s.climbsDone,layout=layoutFor(stage);s.phase='climb';let energy=(s.difficulty==='summit'?5:6)+Math.min(3,s.stageCorrect);s.climb={stage,row:4,col:2,energy,startingEnergy:energy,complete:false,failures:0,layout,steps:[]};showClimb()}
function showClimb(note=''){s.phase='climb';const c=s.climb,area=LEVELS[chapterAt(Math.max(0,s.index-1))],total=s.count/4;screen.innerHTML=`<div class="gamehead"><button class="back" id="back">← Main menu</button><div class="scorechips"><div>🧭 <b>${c.stage+1}/${total}</b> checkpoints</div><div>⭐ <b>${s.score}</b> points</div><div>⚡ <b>${c.energy}</b> energy</div></div></div><div class="climb-layout"><section class="panel climb-wrap"><div class="climb-top"><div><p class="kicker">ROUTE PUZZLE ${c.stage+1}</p><h1>${esc(area.name)} — Climb!</h1><p>Tap a glowing handhold in the row just above your climber.</p></div><span class="pill">NO TIMER</span></div><div class="rock-world ${area.class}" id="rock-world"><div class="wall"></div><div class="rope"></div><div class="goal">⚑ CHECKPOINT</div><div class="hold-grid" id="hold-grid">${c.layout.grid.map((row,r)=>row.map((type,col)=>`<button type="button" class="hold ${type} ${r===c.row&&col===c.col?'current':''} ${r===c.row-1&&Math.abs(col-c.col)<=1?'reachable':''} ${r>c.row?'visited':'locked'}" data-row="${r}" data-col="${col}" aria-label="${type} handhold, row ${5-r}, column ${col+1}" title="${type==='weak'?'Cracked rock: costs 3 energy':type==='boost'?'Golden hold: restores energy':'Solid grip: costs 1 energy'}" ${r!==c.row-1||Math.abs(col-c.col)>1||c.complete?'disabled':''}>${type==='weak'?'!':type==='boost'?'★':''}</button>`).join('')).join('')}</div><div class="climber" id="climber">${characterSvg()}</div>${c.complete?`<div class="climb-complete"><div class="completebox"><div class="big">🏁</div><h2>Checkpoint reached!</h2><p>You found a safe route and completed the climb. ${c.stage===total-1?'Your expedition is ready for the final results.':'A new set of vocabulary missions awaits!'}</p><button class="btn primary" id="continue">${c.stage===total-1?'VIEW RESULTS →':'CONTINUE JOURNEY →'}</button></div></div>`:''}</div></section><aside class="panel climb-side"><div><p class="kicker">CHOOSE YOUR ROUTE</p><h2>Plan each grip.</h2><p class="muted" style="font-size:13px">Move one row upward at a time. You can go straight up or diagonally one column.</p><div class="energy">⚡ ${c.energy} <small>ENERGY LEFT</small></div></div><div class="legend"><div><span></span> Stone grip: −1 energy</div><div><span class="weak"></span> Cracked grip: −3 energy</div><div><span class="boost"></span> Gold grip: +1 energy</div></div><div><div class="climb-notice" id="climb-note">${note||'The glowing holds are reachable. Use the yellow/gold stones to save energy.'}</div><button class="btn secondary" id="reset">↻ RESET CLIMB</button></div></aside></div>`;
 $('#back').onclick=()=>{if(confirm('Leave this expedition? Your unfinished progress will not be saved.'))showHome()};$('#reset').onclick=()=>{startClimb()};$$('[data-row]').forEach(btn=>btn.onclick=()=>moveClimber(+btn.dataset.row,+btn.dataset.col));if(c.complete)$('#continue').onclick=()=>{s.climbsDone++;s.stageCorrect=0;if(s.index>=s.deck.length)finishGame();else{resetQuestion();showQuestion()}window.scrollTo({top:0,behavior:'smooth'})};moveAvatar();msgHeight()}
function moveAvatar(){let box=$('#hold-grid'),climber=$('#climber'),world=$('#rock-world'),c=s.climb;if(!box||!climber||!world)return;let b=box.getBoundingClientRect(),w=world.getBoundingClientRect();let x=(c.col+.5)*b.width/5+b.left-w.left,y=(c.row+.5)*b.height/5+b.top-w.top;climber.style.left=x+'px';climber.style.top=y+'px'}
function moveClimber(r,col){let c=s.climb;if(c.complete||r!==c.row-1||Math.abs(col-c.col)>1)return;let type=c.layout.grid[r][col],cost=type==='weak'?3:type==='boost'?-1:1;let next=c.energy-cost;
 if(next<0){s.climbFails++;c.failures++;c.energy=c.startingEnergy;c.row=4;c.col=2;c.steps=[];showClimb('The rope caught you safely! Try another route and avoid the red cracked rocks.');return}
 c.row=r;c.col=col;c.energy=Math.min(10,next);c.steps.push([r,col]);if(r===0){c.complete=true;let bonus=Math.max(0,c.energy)*7;s.score+=bonus}showClimb(c.complete?'You made it!':'Great grip! Keep climbing toward the summit.')}

 const review=s.deck.filter(w=>s.missed.has(w.term)),accuracy=Math.round(s.correct/s.deck.length*100);screen.innerHTML=`<section class="panel results"><div class="trophy">🏔️🏆</div><p class="kicker">EXPEDITION COMPLETE · PET TRAINER TEST 2</p><h1>YOU REACHED THE SUMMIT!</h1><p class="muted">You rescued the team and collected all your vocabulary badges. Here's your expedition report.</p><div class="numbers"><div class="number"><b>${s.correct}/${s.deck.length}</b><small>First-try answers</small></div><div class="number"><b>${s.score}</b><small>Adventure points</small></div><div class="number"><b>${s.climbsDone}</b><small>Climbs completed</small></div></div><p class="muted">Accuracy: <b>${accuracy}%</b> · Words to review: <b>${review.length}</b> · Rope rescues: <b>${s.climbFails}</b></p><button class="btn primary" id="again">PLAY AGAIN ↻</button>${review.length?`<div class="review"><h2>📖 Your vocabulary review</h2><ul>${review.map(w=>`<li><strong>${esc(w.term)}</strong><span>${esc(w.definition)}</span></li>`).join('')}</ul></div>`:'<p class="pill" style="margin-top:18px">⭐ Perfect! No missed words.</p>'}</section>`;$('#again').onclick=showHome;msgHeight();window.scrollTo({top:0,behavior:'smooth'})}
