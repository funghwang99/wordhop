let lastHeight=0;function tellHeight(){if(window.parent===window||!new URLSearchParams(location.search).has('embed'))return;let el=$('#app');if(!el)return;const h=Math.ceil(el.getBoundingClientRect().height)+20;if(h===lastHeight)return;lastHeight=h;try{window.parent.postMessage({type:'wordhop-petexpress-trainer-test1-height',unitId:'trainer-test-1',height:h},location.origin)}catch(e){}}
window.addEventListener('load',tellHeight);window.addEventListener('resize',tellHeight);if('ResizeObserver' in window)new ResizeObserver(tellHeight).observe($('#app'));
window.PETExpressTrainer1={getWords:()=>WORDS.map(x=>x.term),getState:()=>({phase:state.phase,index:state.index,score:state.score,correct:state.correct,stations:state.routesDone,total:state.deck?.length||0}),debugAnswer:()=>{if(state.phase==='question'){checkAnswer(state.currentType==='meaning'||state.currentType==='context'?true:state.deck[state.index].term)}},debugRoute:()=>{if(state.phase==='route'){state.routeRotation.forEach((_,i)=>{while(!routeTileSolved(i))state.routeRotation[i]=(state.routeRotation[i]+1)%4});drawRoute();tryRoute();}}};
showMenu();tellHeight();
})();
