if(t.type==='script')content+=`<div class="clue">${cutWord(w.cloze)}</div>${optionButtons(t.options)}`;
if(t.type==='check')content+=`<div class="clue"><b>${esc(w.term)}</b><br>“${esc(t.statement)}”</div><div class="answers"><button class="answer bold" data-bool="yes">✓ YES, it fits</button><button class="answer bold" data-bool="no">✕ NO, it doesn’t</button></div>`;
if(t.type==='edit')content+=`<div class="clue">${esc(w.definition)}</div><div class="subheading">Your movie title:</div><div class="slots" id="slots"><span class="slot empty">Tap the pieces below to build the word</span></div><div class="tiles">${t.pieces.map((p,i)=>`<button class="tile" data-tile="${i}">${esc(p.text)}</button>`).join('')}</div><div class="mission-footer"><button class="subtle" id="clear">↺ Reset tiles</button><button id="check-tiles" class="primary" disabled>Check word</button></div>`;
if(t.type==='decode')content+=`<div class="clue">${esc(w.definition)}</div><div class="subheading">${w.term.split(' ').length} word${w.term.includes(' ')?'s':''} · ${w.term.replaceAll(' ','').length} letters</div><form id="decode-form" class="inputrow"><input class="typed" id="typed" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="Type the vocabulary…" aria-label="Your vocabulary answer"><button class="primary answer-btn" type="submit">Check ↗</button></form>`;
content+=`<div class="mission-footer"><button class="subtle" id="hint">💡 Hint ${t.hintUsed?'used':''}</button><span id="feedback" class="feedback" aria-live="polite">${esc(toastText)}</span></div>`;
return content;
}
function optionButtons(opts){return `<div class="answers">${opts.map((x,i)=>`<button class="answer" data-option="${i}"><span class="key">${'ABCD'[i]}</span><span>${esc(x)}</span></button>`).join('')}</div>`}
function filmFrame(){const chapter=1+Math.floor(S.index/6),currentCount=S.index%6;const total=Math.ceil(S.deck.length/6);return `<div class="hud"><div class="hitem"><div class="hlabel">Production progress</div><div class="progresswrap"><div class="progress"><span style="width:${100*S.index/S.deck.length}%"></span></div><div style="font-size:13px;font-weight:950">${S.index}/${S.deck.length}</div></div></div><div class="hitem"><div class="hlabel">Your score</div><div class="hvalue">⭐ ${fmt(S.score)}</div></div><div class="hitem"><div class="hlabel">First takes</div><div class="hvalue">${S.firstCorrect}</div></div><div class="hitem"><button class="tinybtn" id="menu-button">☰ Menu</button></div></div><section class="scene" id="stage" data-genre="${esc(S.genre)}"><div class="scene-inner"><div class="spot"></div><div class="spot b"></div><span class="scene-badge">🎥 ${genres.find(g=>g.id===S.genre).label.toUpperCase()}</span><span class="scene-counter">🎬 TAKE ${S.index+1}</span><div class="stage-caption"><span class="pill">✨ Your own movie</span><span class="pill">🎞️ Scene ${Math.min(total,chapter)} / ${total}</span></div></div><div class="scene-flash"></div><div class="confetti" id="confetti"></div></section>`;}
function sidePanel(){const total=Math.ceil(S.deck.length/6);const current=Math.floor(S.index/6);return `<aside class="card side"><div class="side-heading"><h3>🎞️ Production board</h3><span style="font-size:12px;font-weight:900;color:#8491a7">Reel ${Math.min(current+1,total)}/${total}</span></div><div class="reel">${Array.from({length:Math.min(total,12)},(_,i)=>`<span class="reel-dot ${i<=current?'on':''}">${i<current?'✓':i===current?'●':'·'}</span>`).join('')}</div><div class="sidebox"><span class="sidebox-icon">🎬</span><div><div class="big">${Math.min(6,S.index%6+1)} of 6</div><small>Shots this scene</small></div></div><div class="sidebox"><span class="sidebox-icon">🏆</span><div><div class="big">${S.firstCorrect} first takes</div><small>Best effort, not speed</small></div></div><p class="chapter-progress"><strong>Director’s note:</strong> ${S.index%5===0?'Pick the right cast member.':S.index%5===1?'Complete the next script line.':S.index%5===2?'Check the actor’s definition.':S.index%5===3?'Repair the film’s title card.':'Decode the secret subtitle.'}</p><p class="side-note">All questions pause the action. Wrong attempts don’t skip a word. You can use Hint to reveal a clue, with a small score cost.</p></aside>`;}
function draw(){if(S.phase==='home'){menu();return}if(S.phase==='end'){showResults();return}if(S.phase==='cut'){showCut();return}
screen.innerHTML=filmFrame()+`<section class="main-grid"><div class="card mission" id="mission">${formatQuestion()}</div>${sidePanel()}</section>`;bindCurrent();syncHeight();}
function bindCurrent(){$('#menu-button')?.addEventListener('click',()=>{if(confirm('Leave your current movie? Your score will not be saved until the end.'))menu()});$('#hint')?.addEventListener('click',giveHint);
const t=S.task;if(t.type==='casting'||t.type==='script')document.querySelectorAll('[data-option]').forEach(btn=>btn.addEventListener('click',()=>checkAnswer(t.options[+btn.dataset.option],btn)));
if(t.type==='check')document.querySelectorAll('[data-bool]').forEach(btn=>btn.addEventListener('click',()=>checkAnswer((btn.dataset.bool==='yes')===t.truth,btn)));
if(t.type==='decode')$('#decode-form')?.addEventListener('submit',e=>{e.preventDefault();checkAnswer($('#typed').value,$('#typed'))});
if(t.type==='edit'){
 document.querySelectorAll('[data-tile]').forEach(b=>b.addEventListener('click',()=>pickTile(+b.dataset.tile)));
 $('#clear').addEventListener('click',()=>resetTiles());$('#check-tiles').addEventListener('click',()=>{const built=S.selected.map(i=>t.pieces[i].text).join(t.word.term.includes(' ')?' ':'');checkAnswer(built,$('#check-tiles'))});
}
}
function resetTiles(){S.selected=[];for(const b of document.querySelectorAll('[data-tile]'))b.disabled=false;$('#slots').innerHTML='<span class="slot empty">Tap the pieces below to build the word</span>';$('#check-tiles').disabled=true;}
function pickTile(i){if(busy||S.selected.includes(i))return;S.selected.push(i);const t=S.task;const b=document.querySelector(`[data-tile="${i}"]`);if(b)b.disabled=true;$('#slots').innerHTML=S.selected.map(idx=>`<span class="slot">${esc(t.pieces[idx].text)}</span>`).join('');$('#check-tiles').disabled=S.selected.length!==t.pieces.length;}
function isCorrect(answer){const t=S.task,w=t.word;
if(t.type==='check')return answer===true;
if(t.type==='edit')return norm(answer)===norm(w.term);
if(t.type==='script')return norm(answer)===norm(w.form);
return norm(answer)===norm(w.term);
}
function checkAnswer(answer,btn){if(busy)return;const t=S.task;
if(isCorrect(answer)){
 busy=true;beep('good');if(S.tries===0){S.firstCorrect++;S.score+=120;}else S.score+=40;
 announce(S.tries===0?'Perfect take! +120 points':'Great recovery! +40 points');
 const stage=$('#stage');if(stage)stage.classList.add('flash');
 document.querySelectorAll('.answer').forEach(b=>b.disabled=true);if(btn?.classList)btn.classList.add('correct');
 window.setTimeout(()=>{S.index++;S.shots++;if(S.index>=S.deck.length){finish();return}if(S.index%6===0){S.phase='cut';draw();}else{initTask();S.phase='question';draw();}},560);
 }else{
 S.tries++;S.wrong.add(t.word.term);S.score=Math.max(0,S.score-15);beep('bad');announce('Not quite. Try again — you can still finish this take.',true);
 if(btn?.classList){btn.classList.add('wrong');window.setTimeout(()=>btn.classList.remove('wrong'),480)}
 if(t.type==='edit'){window.setTimeout(()=>{if(!busy)resetTiles()},380)}
 if(t.type==='decode'){const field=$('#typed');if(field){field.setAttribute('aria-invalid','true');field.select()}}
 }
}
function giveHint(){if(busy)return;const t=S.task,w=t.word;if(t.hintUsed){announce('Hint already revealed for this take.');return}t.hintUsed=true;S.score=Math.max(0,S.score-20);S.hints++;
 const msg=(t.type==='casting'||t.type==='script')?`Starts with “${(t.type==='script'?w.form:w.term).slice(0,2).toUpperCase()}…”`:
 t.type==='check'?`Example: ${w.example}`:t.type==='edit'?`First fragment: “${t.segments[0].text}”`:`Starts with “${w.term.slice(0,2)}…”`;
 announce('💡 '+msg);$('#hint').textContent='💡 Hint used';
}
function showCut(){
 const total=Math.ceil(S.deck.length/6);
 S.cameraTarget=22+Math.floor(Math.random()*57);
 S.cameraShot=false;
 const genreCards=genres.map(g=>`<button class="scene-choice locked ${g.id===S.genre?'current':''}" disabled data-genre="${g.id}"><span class="s-icon">${g.icon}</span><strong>${g.label}</strong><small>${g.desc}</small></button>`).join('');
 screen.innerHTML=filmFrame()+`<section class="card cut-panel" style="margin-top:13px"><span class="eyebrow">🎞️ REEL ${Math.floor(S.index/6)} COMPLETE</span><h2 class="cut-title">Direct your next scene!</h2><p>First, position your camera over the green director’s mark. There is no timer: take your time to line up the shot!</p><div class="camera-game"><h3>🎥 Camera control</h3><p>Drag the camera slider until the purple camera lines up with the green target, then press SHOOT.</p><div class="camera-mark" id="camera-mark"><span class="camera-zone" style="left:${S.cameraTarget}%"></span><span class="camera-target" style="left:${S.cameraTarget}%"></span><span class="camera-lens" id="camera-lens" style="left:50%">◉</span></div><input aria-label="Camera position" class="camera-range" id="camera-range" type="range" min="0" max="100" value="50"><div class="camera-actions"><button class="primary" id="shoot-btn">🎬 SHOOT THIS SCENE</button><span class="camera-feedback" id="camera-feedback">Move the slider to frame the shot.</span></div></div><div style="margin-top:20px;text-align:left;font-size:12px;font-weight:950;letter-spacing:1.2px;color:#71809a">THEN CHOOSE THE NEXT FILM SET</div><div class="scenecards">${genreCards}</div></section>`;
 $('#menu-button')?.addEventListener('click',()=>{if(confirm('Leave your current movie?'))menu()});
 $('#camera-range').addEventListener('input',e=>{$('#camera-lens').style.left=Number(e.target.value)+'%'});
 $('#shoot-btn').addEventListener('click',()=>{
   if(S.cameraShot)return;
   const diff=Math.abs(Number($('#camera-range').value)-S.cameraTarget);
   const response=$('#camera-feedback');
   if(diff>23){beep('bad');response.textContent='Not centered yet. Move closer to the green mark!';response.style.color='#c65b58';return}
   const bonus=diff<=10?200:100;S.score+=bonus;S.cameraShot=true;beep('good');
   response.textContent=(diff<=10?'PERFECT SHOT! +200':'GREAT SHOT! +100')+' · Pick a film set below.';response.style.color='#299d79';
   $('#shoot-btn').disabled=true;$('#shoot-btn').textContent='✓ SHOT RECORDED';$('#camera-range').disabled=true;
   document.querySelectorAll('[data-genre]').forEach(b=>{b.disabled=false;b.classList.remove('locked')});
 });
 document.querySelectorAll('[data-genre]').forEach(b=>b.addEventListener('click',()=>{
   if(!S.cameraShot)return;
   const genre=b.dataset.genre;if(genre!==S.genre)S.score+=120;
   S.genre=genre;S.genreLog.push(genre);S.phase='question';initTask();draw();scrollGame();
 }));syncHeight();
}
function sendResults(payload){if(!isEmbed)return;try{window.parent.postMessage(payload,location.origin)}catch(e){}}
function finish(){S.phase='end';S.completed=true;const best=(()=>{try{return JSON.parse(localStorage.getItem(BEST_KEY)||'null')}catch(e){return null}})();if(!best||S.score>best.score||S.score===best.score&&S.deck.length>best.n){try{localStorage.setItem(BEST_KEY,JSON.stringify({score:S.score,n:S.deck.length,at:Date.now()}))}catch(e){}};
sendResults({type:'wordhop-petreelquest-authentic1-test4-result',unitId:course,total:S.deck.length,attempted:S.deck.length,correct:S.firstCorrect,completed:true,score:S.score,missed:[...S.wrong],genres:S.genreLog,at:Date.now()});showResults();scrollGame();}
function showResults(){const n=S.deck.length,accuracy=Math.round(S.firstCorrect/n*100),grade=accuracy>=85?'BLOCKBUSTER':accuracy>=65?'CROWD FAVOURITE':'RISING DIRECTOR';screen.innerHTML=`<section class="card results"><div class="resultgrid"><div class="poster"><div class="posterlabel"><p>✨ A FILM BY YOU ✨</p><h2>${grade}</h2><p>PET AUTHENTIC · TEST 4</p></div></div><div class="res-info"><span class="eyebrow">🎬 IT’S A WRAP!</span><h2>Your movie is ready!</h2><p>You directed a full vocabulary film. Great work! Keep practising the tricky words to earn a higher premiere rating.</p><div class="scores"><div class="scoreitem"><b>${fmt(S.score)}</b><small>Final movie score</small></div><div class="scoreitem"><b>${accuracy}%</b><small>First-try accuracy</small></div><div class="scoreitem"><b>${S.firstCorrect}/${n}</b><small>Perfect takes</small></div><div class="scoreitem"><b>${S.genreLog.length}</b><small>Film sets visited</small></div></div>${S.wrong.size?`<div class="missedbox"><b>Review these ${S.wrong.size} words:</b><br>${[...S.wrong].map(esc).join(' · ')}</div>`:`<div class="missedbox">🎉 Every answer was correct on the first try!</div>`}<div class="resultbuttons"><button id="again" class="primary">🎬 SHOOT AGAIN</button><button id="back" class="subtle">Change settings</button></div></div></div></section>`;
$('#again').addEventListener('click',start);$('#back').addEventListener('click',menu);syncHeight();}
// Browser controls: Enter is handled by the input/form; A-D trigger cast or script buttons.
window.addEventListener('keydown',e=>{if(S.phase!=='question'||busy)return;if(e.target?.tagName==='INPUT')return;const i='abcd'.indexOf(e.key.toLowerCase());if(i>=0){const b=document.querySelectorAll('[data-option]')[i];if(b){e.preventDefault();b.click();}}if(e.key==='Backspace'&&S.task?.type==='edit'){e.preventDefault();resetTiles();}});
let prevHeight=0;function syncHeight(){if(!isEmbed)return;const root=$('#app');if(!root)return;const height=Math.ceil(root.getBoundingClientRect().height)+16;if(height===prevHeight)return;prevHeight=height;try{window.parent.postMessage({type:'wordhop-petreelquest-authentic1-test4-height',unitId:course,height},location.origin)}catch(e){}}
window.addEventListener('resize',syncHeight);window.addEventListener('load',syncHeight);if(typeof ResizeObserver!=='undefined')new ResizeObserver(syncHeight).observe($('#app'));
// Export a tiny, read-only debug surface for future regression tests.
window.PETReelQuestTest4={getWords:()=>WORDS.map(w=>w.term),getState:()=>({phase:S.phase,index:S.index,score:S.score,firstCorrect:S.firstCorrect,missed:S.wrong?[...S.wrong]:[],count:S.deck?.length||0}),advanceForTest:()=>{if(S.phase==='question'){const t=S.task;checkAnswer(t.type==='check'?t.truth:t.type==='script'?t.word.form:t.word.term)}}};
menu();syncHeight();
})();
</script></body></html>
