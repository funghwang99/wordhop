name: Cambridge remaining answer replay gaps
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/cam-final-gaps-small.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: CAM ${{ matrix.book }} missing cues
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        book: [14, 16, 17, 18, 19, 21]
    env:
      BOOK: ${{ matrix.book }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /dist/cambridge-study.js
            /cambridge_14_media*.zip
            /cambridge_16_media*.zip
            /cambridge_17_media*.zip
            /cambridge_18_media*.zip
            /cambridge_19_media*.zip
            /cambridge_21_media_test_*.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install faster-whisper==1.2.1
      - name: Re-decode only recordings containing unresolved questions
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path
          from faster_whisper import WhisperModel
          book=int(os.environ['BOOK'])
          target={14:{1:[31]},16:{1:[11],4:[9,30]},17:{1:[13,18],2:[33],3:[9]},18:{1:[31]},19:{1:[14],4:[18,25]},21:{2:[20],4:[39]}}[book]
          data=Path('dist/cambridge-study.js').read_text(encoding='utf-8')
          marker=re.search(r'window\.WORDHOP_CAMBRIDGE_STUDY\s*=\s*',data)
          study=json.JSONDecoder().raw_decode(data[marker.end():].lstrip())[0]
          wanted={(t,(q-1)//10+1) for t,qs in target.items() for q in qs if str(q) not in study[f'{book}-{t}'].get('cues',{})}
          out=Path('gap-audit');out.mkdir(exist_ok=True)
          audio=Path('gap-audio');audio.mkdir(exist_ok=True)
          prefix=f'media/cambridge-ielts-academic-{book}'+('-2026' if book==21 else '')
          pattern=re.compile(re.escape(prefix)+r'/audio/test-(\d+)-section-([1-4])\.(m4a|mp3)')
          tracks={}
          for bundle in sorted(Path('.').glob(f'cambridge_{book}_media*.zip')):
              with zipfile.ZipFile(bundle) as z:
                  manifest=json.loads(z.read('cambridge_media_manifest.json'))
                  assert manifest['bundle']==bundle.name
                  for rel,sha in manifest['paths'].items():
                      m=pattern.fullmatch(rel)
                      if not m: continue
                      t,p=int(m[1]),int(m[2])
                      if (t,p) not in wanted: continue
                      assert (t,p) not in tracks
                      payload=z.read(rel)
                      assert hashlib.sha256(payload).hexdigest()==sha
                      assert study[f'{book}-{t}']['audioSha256'][str(p)]==sha
                      dest=audio/f'{t}-{p}.{m[3]}'
                      dest.write_bytes(payload)
                      tracks[t,p]=(dest,sha)
          assert set(tracks)==wanted, (wanted,set(tracks))
          if wanted:
              model=WhisperModel('Systran/faster-whisper-small.en',device='cpu',compute_type='int8',cpu_threads=4)
              for (t,p),(path,sha) in sorted(tracks.items()):
                  print(f'CAM{book} T{t} P{p} exact source hash {sha}',flush=True)
                  segments,info=model.transcribe(str(path),language='en',beam_size=8,word_timestamps=True,vad_filter=False,condition_on_previous_text=False)
                  words=[{'start':round(w.start,3),'end':round(w.end,3),'word':w.word,'probability':round(w.probability,4)} for seg in segments for w in (seg.words or []) if w.start is not None and w.end is not None]
                  assert words
                  (out/f'{book}-{t}-{p}.json').write_text(json.dumps({'book':book,'test':t,'part':p,'questions':[q for q in target[t] if (q-1)//10+1==p],'sha256':sha,'duration':info.duration,'model':'Systran/faster-whisper-small.en','words':words},ensure_ascii=False))
          (out/'manifest.json').write_text(json.dumps({'book':book,'tracks':sorted(wanted),'requested':target,'manual_verified':False}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cam-${{ matrix.book }}-gap-small-asr
          path: gap-audit
          retention-days: 7
