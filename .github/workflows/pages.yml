name: Publish WordHop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check game coverage
        run: node qa/check-all-words.cjs
      - name: Check book readings
        run: node qa/check-readings.cjs
      - name: Build static site
        run: python3 -B scripts/build_github_pages.py
      - name: Check project paths and content
        run: python3 -B qa/check_github_pages.py
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
